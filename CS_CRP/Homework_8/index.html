<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE CREATIVE LAB — Amna Binte Atta</title>
  <meta name="description" content="An unconventional interactive personal portfolio and digital laboratory of Amna Binte Atta.">
  
  <!-- Distinctive Google Fonts: Syne & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="laboratory-body">
  <!-- ACCESSIBILITY SKIP LINK -->
  <a href="#lab-environment" class="skip-link">Skip to Laboratory Environment</a>
  <!-- SCREEN READER ANNOUNCEMENTS -->
  <div id="sr-announcements" class="sr-only" role="status" aria-live="polite"></div>
  <!-- AMBIENT CANVAS FOR PARTICLES & GRID DYNAMICS -->
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>
  <!-- INITIALISATION / PRELOADER OVERLAY -->
  <div id="preloader-overlay" class="preloader-overlay" role="dialog" aria-modal="true" aria-label="Laboratory Initialization">
    <div class="preloader-content">
      <div class="preloader-aperture" aria-hidden="true">
        <div class="aperture-ring outer"></div>
        <div class="aperture-ring middle"></div>
        <div class="aperture-core"></div>
      </div>
      <div class="preloader-status">
        <span class="mono-code">[SYS_BOOT_SEQUENCE]</span>
        <h2 class="preloader-title">INITIALISING THE CREATIVE LAB...</h2>
        <div class="preloader-bar-wrap">
          <div class="preloader-bar-fill" id="preloader-progress"></div>
        </div>
